name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Demo smoke (templates → FK → URDF)
        run: python scripts/demo_smoke.py
      - name: Server syntax
        run: python -c "import ast; ast.parse(open('server.py').read())"
